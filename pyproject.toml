[project]
name = "test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Piyush", email = "pagarwal@palo-it.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "pydantic>=2.14.3",
]

[project.scripts]
test = "test:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
